<!DOCTYPE html>
<html lang="en" data-theme="{% if ui_settings and ui_settings.dark_mode %}dark{% else %}light{% endif %}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Export — Flasky Notes</title>
    <link rel="icon" type="image/x-icon" href="/static/images/amazing_logo.png">
    <!-- E2EE (mandatory — always loaded) -->
    <script nonce="{{ csp_nonce() }}" src="{{ url_for('static', filename='js/crypto.js') }}"></script>
    <script nonce="{{ csp_nonce() }}" src="{{ url_for('static', filename='js/e2ee.js') }}"></script>
    <script nonce="{{ csp_nonce() }}" src="{{ url_for('static', filename='js/lib/jszip.min.js') }}"></script>
    <style>
    .export-page {
        max-width: 600px;
        margin: 0 auto;
        padding: 2rem 1rem 3rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #1f2329;
    }
    [data-theme="dark"] .export-page { color: #e6e6e6; }
    .export-page h1 { font-size: 1.75rem; margin-bottom: 0.5rem; }
    .export-page p { color: #6b7280; margin: 0 0 1.5rem; }
    [data-theme="dark"] .export-page p { color: #9ca3af; }
    .export-card {
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
        background: #fff;
    }
    [data-theme="dark"] .export-card { background: #1e1e2e; border-color: #2a2a3a; }
    .export-card h2 { font-size: 1.1rem; margin: 0 0 0.75rem; }
    .export-card ul { margin: 0; padding-left: 1.25rem; color: #4b5563; }
    [data-theme="dark"] .export-card ul { color: #9ca3af; }
    .export-buttons { display: flex; gap: 0.75rem; margin-top: 1rem; }
    .btn-export {
        flex: 1; padding: 0.75rem 1rem; border: 1px solid #d1d5db; background: #fff;
        border-radius: 6px; cursor: pointer; font-size: 0.95rem; color: inherit;
    }
    [data-theme="dark"] .btn-export { background: #1e1e2e; border-color: #2a2a3a; }
    .btn-export:hover { background: #f3f4f6; }
    [data-theme="dark"] .btn-export:hover { background: #252535; }
    .btn-export-secondary { background: transparent; }
    .btn-export:disabled { opacity: 0.5; cursor: not-allowed; }
    .export-progress { display: none; margin-top: 1rem; }
    .bar { height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden; margin-top: 0.5rem; }
    [data-theme="dark"] .bar { background: #2a2a3a; }
    .bar-fill { height: 100%; background: #3b82f6; width: 0%; transition: width 0.2s; }
    #export-status { font-size: 0.85rem; color: #6b7280; }
    [data-theme="dark"] #export-status { color: #9ca3af; }
    body { background: #f9fafb; margin: 0; }
    [data-theme="dark"] body { background: #14141f; }
    </style>
    {% include '_custom_theme.html' %}
</head>
<body data-encrypted="true">
    <div class="export-page">
        <h1>Export Notes</h1>
        <p>Download a zip archive of your notes, categories, and attachments.</p>

        <div class="export-card">
            <h2>What's included</h2>
            <ul>
                <li>All notes as <strong>.md</strong> files (with frontmatter)</li>
                <li>Categories and subcategories as folders</li>
                <li>All attachments in an <strong>attachments/</strong> folder</li>
            </ul>
        </div>

        <div class="export-buttons">
            <button class="btn-export" id="btn-export-decrypted">Download Decrypted .zip</button>
            <button class="btn-export btn-export-secondary" id="btn-export-encrypted">Download Encrypted .zip</button>
        </div>

        <div class="export-progress" id="export-progress">
            <span id="export-status">Preparing export...</span>
            <div class="bar"><div class="bar-fill" id="export-bar"></div></div>
        </div>
    </div>

<script nonce="{{ csp_nonce() }}">
var encrypted = true;

document.getElementById('btn-export-decrypted').addEventListener('click', function() { startExport(true); });
document.getElementById('btn-export-encrypted').addEventListener('click', function() { startExport(false); });

async function startExport(decrypt) {
    var buttons = document.querySelectorAll('.btn-export');
    var progress = document.getElementById('export-progress');
    var status = document.getElementById('export-status');
    var bar = document.getElementById('export-bar');

    buttons.forEach(function(b) { b.disabled = true; });
    progress.style.display = 'block';
    status.textContent = 'Fetching notes...';
    bar.style.width = '10%';

    try {
        if (decrypt) {
            var ready = await FlaskyE2EE.init();
            if (!ready) return;
        }

        var resp = await fetch('/api/export/notes');
        var data = await resp.json();
        if (data.error) throw new Error(data.error);

        var notes = data.notes;
        var attachments = data.attachments;
        bar.style.width = '30%';

        if (decrypt) {
            status.textContent = 'Decrypting notes...';
            for (var i = 0; i < notes.length; i++) {
                var n = notes[i];
                if (n.title) n.title = await FlaskyE2EE.decryptField(n.title);
                if (n.content) n.content = await FlaskyE2EE.decryptField(n.content);
                if (n.properties) n.properties = await FlaskyE2EE.decryptField(n.properties);
                if (n.category) n.category = await FlaskyE2EE.decryptField(n.category);
                bar.style.width = (30 + (i / notes.length) * 30) + '%';
            }
        }
        bar.style.width = '60%';
        status.textContent = 'Building zip...';

        var zip = new JSZip();

        for (var i = 0; i < notes.length; i++) {
            var n = notes[i];
            var cat = n.category || 'Uncategorized';
            var title = sanitizeFilename(n.title || 'Untitled');
            var content = buildFullContent(n.content, n.properties);
            zip.file(cat + '/' + title + '.md', content);
        }

        if (attachments.length > 0) {
            status.textContent = 'Fetching attachments...';
            for (var i = 0; i < attachments.length; i++) {
                var att = attachments[i];
                try {
                    var attResp = await fetch('/attachment/' + att.id + '/' + encodeURIComponent(att.filename));
                    if (attResp.ok) {
                        var blob = await attResp.arrayBuffer();
                        var fileData = blob;
                        if (decrypt) {
                            var isEnc = attResp.headers.get('X-Encrypted') === 'true';
                            if (isEnc) {
                                fileData = await FlaskyE2EE.decryptBlob(new Uint8Array(blob));
                            }
                        }
                        var attFilename = att.filename;
                        if (decrypt) {
                            try { attFilename = await FlaskyE2EE.decryptField(att.filename); } catch(e) {}
                        }
                        zip.file('attachments/' + sanitizeFilename(attFilename), fileData);
                    }
                } catch (e) {
                    console.warn('Failed to fetch attachment', att.id, e);
                }
                bar.style.width = (60 + (i / attachments.length) * 30) + '%';
            }
        }

        bar.style.width = '90%';
        status.textContent = 'Compressing...';

        var filename = decrypt ? 'flasky-notes-export.zip' : 'flasky-notes-export-encrypted.zip';
        var blob = await zip.generateAsync({type: 'blob'});
        bar.style.width = '100%';
        status.textContent = 'Done!';

        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
    } catch (e) {
        status.textContent = 'Export failed: ' + e.message;
        console.error('Export error:', e);
    } finally {
        buttons.forEach(function(b) { b.disabled = false; });
    }
}

function sanitizeFilename(name) {
    return name.replace(/[<>:"|?*\\]/g, '_');
}

function buildFullContent(content, properties) {
    var fm = buildFrontmatter(properties);
    return fm + (content || '');
}

function buildFrontmatter(properties) {
    if (!properties) return '';
    var props;
    try {
        props = (typeof properties === 'string') ? JSON.parse(properties) : properties;
    } catch (e) {
        return '';
    }
    if (!props || typeof props !== 'object' || Object.keys(props).length === 0) return '';
    var lines = ['---'];
    for (var key in props) {
        if (!props.hasOwnProperty(key)) continue;
        var val = props[key];
        if (Array.isArray(val)) {
            lines.push(key + ':');
            for (var i = 0; i < val.length; i++) {
                lines.push('  - ' + val[i]);
            }
        } else {
            lines.push(key + ': ' + val);
        }
    }
    lines.push('---');
    return lines.join('\n') + '\n';
}
</script>
</body>
</html>
