{% extends "template-loggedout.html" %}
{% block body %}
<div class="auth-card">
<div class="auth-logo"><img src="/static/images/amazing_logo.png" alt="Flasky Notes" width="96" height="96"></div>
<h1 class="auth-title">Vault Locked</h1>
<p class="auth-subtitle">Re-enter your password to decrypt your notes.</p>
<form id="unlock-form">
    <div class="auth-field">
      <input type="password" class="auth-input" id="unlock-password" placeholder="Password..." autocomplete="current-password" autofocus required>
    </div>

    {% if password_hint %}
    <p class="auth-hint">Hint: {{ password_hint }}</p>
    {% endif %}

    <div id="unlock-error" class="auth-error"></div>
    <div id="unlock-status" class="auth-status">Deriving keys...</div>

    <button class="auth-btn" type="submit" id="unlock-btn">Unlock</button>
    <a href="/logout" class="auth-logout">Log out instead</a>
</form>
</div>

<script nonce="{{ csp_nonce() }}" src="{{ url_for('static', filename='js/crypto.js') }}"></script>
<script nonce="{{ csp_nonce() }}">
(function() {
    var form = document.getElementById('unlock-form');
    var errorEl = document.getElementById('unlock-error');
    var statusEl = document.getElementById('unlock-status');
    var btn = document.getElementById('unlock-btn');
    var encSymKey = {{ encrypted_sym_key|tojson }};
    var keySalt = {{ key_salt|tojson }};

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        errorEl.style.display = 'none';
        statusEl.style.display = 'block';
        statusEl.textContent = 'Deriving keys...';
        btn.disabled = true;

        var password = document.getElementById('unlock-password').value;

        try {
            var keys = await FlaskyCrypto.deriveKeys(password, keySalt);
            statusEl.textContent = 'Unwrapping key...';
            var symKey = await FlaskyCrypto.unwrapSymmetricKey(encSymKey, keys.kek);
            await FlaskyCrypto.storeSymmetricKey(symKey);

            // Redirect back to original page (validate to prevent open redirect)
            var params = new URLSearchParams(window.location.search);
            var next = params.get('next') || '/notes';
            if (!next.startsWith('/') || next.startsWith('//')) next = '/notes';
            window.location.href = next;
        } catch (err) {
            errorEl.textContent = 'Incorrect password. Please try again.';
            errorEl.style.display = 'block';
            statusEl.style.display = 'none';
            btn.disabled = false;
        }
    });
})();
</script>
{% endblock %}
