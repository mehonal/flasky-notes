[project]
name = "flasky-notes"
version = "3.0.0"
description = "Encrypted note-taking app with Obsidian sync"
readme = "readme.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "flask",
    "requests",
    "flask_sqlalchemy",
    "bcrypt",
    "flask_migrate",
    "python-dotenv",
    "gunicorn",
    "flask-talisman",
    "PyYAML",
    "ollama",
    "marshmallow",
    "flask-smorest",
    "cryptography",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["flasky", "flasky.blueprints", "flasky.services", "flasky.schemas"]