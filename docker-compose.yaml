services:
  web:
    build: .
    image: flasky-notes
    restart: unless-stopped
    ports:
      # Host port only; the container always listens on 5000.
      - "${PORT:-5000}:5000"
    volumes:
      - flasky_data:/app/instance
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      # Fixed so .env interpolation can't redirect it to a host-relative
      # path outside the volume (breaks persistence).
      - DATABASE_URI=sqlite:////app/instance/db.sqlite3
      - SECRET_KEY=${SECRET_KEY}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-2}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-4}
      - LOG_LEVEL=${LOG_LEVEL:-WARNING}
      - RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY:-}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:' + __import__('os').environ.get('PORT', '5000') + '/healthz', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  flasky_data:
